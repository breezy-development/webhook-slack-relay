[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-slack-relay"
version = "1.0.0"
description = "Relay GitHub webhooks to Slack with signature checks, dedupe, retries and a delivery log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slack-relay = "slack_relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slack_relay = ["samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
